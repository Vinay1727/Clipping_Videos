services:
  - type: web
    name: clipwave-api
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      apt-get install -y ffmpeg || true
    startCommand: gunicorn app:app --workers 1 --timeout 600 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: YT_COOKIES_CONTENT
        sync: false
    healthCheckPath: /
    autoDeploy: true
